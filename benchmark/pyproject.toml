[project]
name = "highs-benchmark"
version = "0.1.0"
description = "MIPLIB2017 benchmark harness for HiGHS vs. other MIP solvers (e.g. Gurobi)"
requires-python = ">=3.10"
dependencies = [
    "gurobipy>=12.0,<13",
    "matplotlib>=3.8",
    "optuna>=3.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
managed = true
